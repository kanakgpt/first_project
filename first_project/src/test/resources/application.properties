spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS student
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
